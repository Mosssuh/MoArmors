          - ''
          - '&e&lINFO'
          - '&e ❙ &fLevel: &a%level%&7/&a%max_level%'
          - ''
          - '&e&lBOOSTS'
          - '&e ❙ &fBoost: &e+{local_math_%level%/200}'
          - ''
          - '&e&lEXTRA ABILITIES'
          - '&e ❙ &fKeys Generator: {local_changeoutput_!=_input:%variable_{tokens_generator}%_matcher:0_ifmatch:&eActive_else:&cLevel 25 to Unlock}'
          - '&r     &8Receive tokens keys'
          - '&r     &8when you have full set.'
          - ''
          - '%progress%'
          - ''
      LEGGINGS:
        material: DIAMOND_LEGGINGS
        data: 0
        name: '&e&lTokens &f❙ &fLeggings'
        lore:
          - ''
          - '&7&o(( Equip this piece and receive'
          - '&7&oboost of tokens ))'
          - ''
          - '&e&lINFO'
          - '&e ❙ &fLevel: &a%level%&7/&a%max_level%'
          - ''
          - '&e&lBOOSTS'
          - '&e ❙ &fBoost: &e+{local_math_%level%/200}'
          - ''
          - '&e&lEXTRA ABILITIES'
          - '&e ❙ &fKeys Generator: {local_changeoutput_!=_input:%variable_{tokens_generator}%_matcher:0_ifmatch:&eActive_else:&cLevel 25 to Unlock}'
          - '&r     &8Receive tokens keys'
          - '&r     &8when you have full set.'
          - ''
          - '%progress%'
          - ''
      BOOTS:
        material: DIAMOND_BOOTS
        data: 0
        name: '&e&lTokens &f❙ &fBoots'
        lore:
          - ''
          - '&7&o(( Equip this piece and receive'
          - '&7&oboost of tokens ))'
          - ''
          - '&e&lINFO'
          - '&e ❙ &fLevel: &a%level%&7/&a%max_level%'
