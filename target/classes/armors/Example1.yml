Armors:
  TokensArmor:
    code: TokensArmor
    tags: Tokens, Armor
    variables:
      - 'tokens_generator -> 0'
    upgrades:
      max-level: 50
      cost-per-level: 5000
      message:
        progress:
          - '&e ❙ &fProgress: &a%exp%&7/&a%cost%'
        maxed-progress:
          - '&e ❙ &fProgress: &c&lMAX LEVEL'
    exp:
      BLOCK_BREAK:
        - 'ALL -> 1'
    pieces-info:
      HELMET:
        material: DIAMOND_HELMET
        data: 0
        name: '&e&lTokens &f❙ &fHelmet'
        lore:
          - ''
          - '&7&o(( Equip this piece and receive'
          - '&7&oboost of tokens ))'
          - ''
          - '&e&lINFO'
          - '&e ❙ &fLevel: &a%level%&7/&a%max_level%'
          - ''
          - '&e&lBOOSTS'
          - '&e ❙ &fBoost: &e+{local_math_%level%/200}'
          - ''
          - '&e&lEXTRA ABILITIES'
          - '&e ❙ &fKeys Generator: {local_changeoutput_!=_input:%variable_{tokens_generator}%_matcher:0_ifmatch:&eActive_else:&cLevel 25 to Unlock}'
          - '&r     &8Receive tokens keys'
          - '&r     &8when you have full set.'
          - ''
          - '%progress%'
          - ''
      CHESTPLATE:
        material: DIAMOND_CHESTPLATE
        data: 0
        name: '&e&lTokens &f❙ &fChestplate'
        lore:
          - ''
          - '&7&o(( Equip this piece and receive'
